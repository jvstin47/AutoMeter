name: Build & Release AutoMeter APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build AutoMeter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building AutoMeter version: ${VERSION}"

      - name: Install dependencies
        run: flutter pub get

      - name: Run automated test suite
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release --build-name="${{ env.VERSION }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AutoMeter-v${{ env.VERSION }}.apk

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "AutoMeter v${{ env.VERSION }}"
          tag_name: "v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/AutoMeter-v${{ env.VERSION }}.apk
          body: |
            ## 🛺 AutoMeter v${{ env.VERSION }}

            Download the standalone APK below to install and test directly on your Android phone.

            ### 📦 Download Assets
            - **[AutoMeter-v${{ env.VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/AutoMeter-v${{ env.VERSION }}.apk)**

            ### 🚀 Features in this Release:
            - **Live Auto-Rickshaw Fare Meter**: Base fare, per-km rate, waiting time tracking.
            - **Dynamic NPCI UPI QR Codes**: Generates dynamic `upi://pay` QR with exact fare amount.
            - **Dual Mode**: High-accuracy GPS tracking + Indoor Demo Simulator (with traffic halts & speed multipliers).
            - **Passenger OLED HUD**: Large 92pt amber digits for rear-seat visibility.
            - **Cloud & Offline Sync**: Supabase sync queue with offline-first persistence.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
